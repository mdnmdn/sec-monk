[project]
name = "secmonk"
version = "0.1.0"
description = "Holistic vulnerability scanner prototype: vuln-data mirror, software inventory, matching"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Marco De Nittis" }]
dependencies = [
    "httpx>=0.27",
    "typer>=0.12",
    "rich>=13",
    "univers>=30",
    "packageurl-python>=0.15",
    "pyyaml>=6",
]

[project.scripts]
secmonk = "secmonk.cli:app"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/secmonk"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"
