[project]
name = "secmonk"
version = "0.1.0"
description = "Holistic vulnerability scanner prototype: vuln-data mirror, software inventory, matching"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Marco De Nittis" }]
dependencies = [
    "httpx>=0.27",
    "typer>=0.12",
    "rich>=13",
    "univers>=30",
    "packageurl-python>=0.15",
    "pyyaml>=6",
    "zstandard>=0.25.0; python_version < '3.14'",
    "paramiko>=5.1.0",
]

[project.scripts]
secmonk = "secmonk.cli:app"

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/secmonk"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "pyproject.toml", "LICENSE*"]
exclude = ["**/__pycache__", "*.db"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: slow test (deselect with -m 'not slow')"]
# TODO: enable once the whole suite is free of leaked connections/files:
# filterwarnings = ["error::ResourceWarning"]

[tool.ruff]
line-length = 110
target-version = "py312"

# TODO: enable once the existing findings are fixed (183 E501, RUF100, E402 in collectors/lang, SIM105 ...):
# [tool.ruff.lint]
# select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
