[tools]
python = "3.13"
uv = "latest"

[env]
_.python.venv = { path = ".venv", create = true }

[tasks.sync]
description = "Install/refresh dependencies"
run = "uv sync"

[tasks.test]
description = "Run the test suite"
run = "uv run pytest -q"

[tasks.lint]
description = "Lint"
run = "uv run ruff check src tests"

[tasks.docs-index]
description = "Regenerate _docs/INDEX.md from frontmatter"
run = "uv run python scripts/docs_index.py"
