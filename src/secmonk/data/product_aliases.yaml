# Curated alias table: how locally-observed names map to the vendor/product spelling used by
# CVE records (CNA `affected`) and NVD CPEs. Matching is case-insensitive.
#   names       — app/display names and normalized forms (see classify.normalize_product_name)
#   bundle_ids  — macOS CFBundleIdentifier
#   brew        — Homebrew formula / cask names
#   product     — normalized product as found in CVE `affected` / CPE (underscores -> spaces)
#   cpe_product — CPE spelling if different (underscores kept)
# Grow this table from real scans: `secmonk inventory unmatched` lists candidates.
products:
  # ---- browsers
  - vendor: google
    product: chrome
    names: [google chrome, chrome]
    bundle_ids: [com.google.Chrome]
    brew: [google-chrome]
  - vendor: mozilla
    product: firefox
    names: [firefox, mozilla firefox]
    bundle_ids: [org.mozilla.firefox]
    brew: [firefox]
  - vendor: mozilla
    product: thunderbird
    names: [thunderbird]
    bundle_ids: [org.mozilla.thunderbird]
    brew: [thunderbird]
  - vendor: microsoft
    product: edge chromium
    cpe_product: edge_chromium
    names: [microsoft edge]
    bundle_ids: [com.microsoft.edgemac]
    brew: [microsoft-edge]
  - vendor: apple
    product: safari
    names: [safari]
    bundle_ids: [com.apple.Safari]
  - vendor: brave
    product: brave browser
    names: [brave browser]
    bundle_ids: [com.brave.Browser]
    brew: [brave-browser]
  # ---- dev tools
  - vendor: apple
    product: xcode
    names: [xcode]
    bundle_ids: [com.apple.dt.Xcode]
  - vendor: microsoft
    product: visual studio code
    names: [visual studio code, code]
    bundle_ids: [com.microsoft.VSCode]
    brew: [visual-studio-code]
  - vendor: docker
    product: desktop
    names: [docker desktop, docker]
    bundle_ids: [com.docker.docker]
    brew: [docker-desktop, docker]
  - vendor: jetbrains
    product: intellij idea
    names: [intellij idea, intellij idea ce]
    bundle_ids: [com.jetbrains.intellij, com.jetbrains.intellij.ce]
  - vendor: git-scm
    product: git
    names: [git]
    brew: [git]
  # ---- communication / office
  - vendor: slack
    product: slack
    names: [slack]
    bundle_ids: [com.tinyspeck.slackmacgap]
    brew: [slack]
  - vendor: zoom
    product: zoom
    names: [zoom.us, zoom, zoom workplace]
    bundle_ids: [us.zoom.xos]
    brew: [zoom]
  - vendor: microsoft
    product: teams
    names: [microsoft teams]
    bundle_ids: [com.microsoft.teams2, com.microsoft.teams]
    brew: [microsoft-teams]
  - vendor: microsoft
    product: office
    names: [microsoft word, microsoft excel, microsoft powerpoint, microsoft outlook]
    bundle_ids: [com.microsoft.Word, com.microsoft.Excel, com.microsoft.Powerpoint, com.microsoft.Outlook]
  - vendor: adobe
    product: acrobat reader
    names: [adobe acrobat reader, adobe acrobat reader dc, acrobat reader]
    bundle_ids: [com.adobe.Reader]
    brew: [adobe-acrobat-reader]
  - vendor: videolan
    product: vlc media player
    cpe_product: vlc_media_player
    names: [vlc]
    bundle_ids: [org.videolan.vlc]
    brew: [vlc]
  - vendor: 1password
    product: 1password
    names: [1password, 1password 7, 1password 8]
    bundle_ids: [com.1password.1password]
  # ---- runtimes / frameworks
  - vendor: electronjs
    product: electron
    names: [electron, electron framework]
    brew: [electron]
  - vendor: oracle
    product: jdk
    names: [java, jdk]
  # ---- common brew formulae (upstream projects)
  - vendor: openssl
    product: openssl
    names: [openssl]
    brew: [openssl, openssl@3, openssl@1.1]
  - vendor: haxx
    product: curl
    names: [curl]
    brew: [curl]
  - vendor: openbsd
    product: openssh
    names: [openssh]
    brew: [openssh]
  - vendor: python
    product: python
    names: [python]
    brew: [python, python@3.12, python@3.13, python@3.11]
  - vendor: nodejs
    product: node.js
    names: [node, nodejs, node.js]
    brew: [node, node@20, node@22]
  - vendor: sqlite
    product: sqlite
    names: [sqlite]
    brew: [sqlite]
  - vendor: gnu
    product: wget
    names: [wget]
    brew: [wget]
  - vendor: ffmpeg
    product: ffmpeg
    names: [ffmpeg]
    brew: [ffmpeg]
  # ---- brew formulae / casks from a real /opt/homebrew `inventory unmatched` + brew-name-vendor misses (2026-11-08).
  # Each spelling is evidenced by the CVE id in the comment, found in the cvelist (2020+) + NVD mirror
  # ([cna] = CVE List `affected`, [nvd] = NVD CPE only). Reason: the formula name is not the CVE product, or the
  # guessed vendor (forge org / homepage) disagrees with the CVE vendor, so the brew-name-vendor rule lost the rows.
  # Multi-vendor identities (aria2, libx11, jpeg-xl, webp, zeromq, little-cms2, aom, mongodb-database-tools) are
  # in brew_cpe_seed.csv instead (an alias entry carries one vendor only).
  - {vendor: nghttp2, product: nghttp2, brew: [libnghttp2]}                       # [cna] CVE-2026-58055, CVE-2015-8659
  - {vendor: ngtcp2, product: ngtcp2, brew: [libngtcp2]}                          # [cna] CVE-2024-52811, CVE-2026-40170
  - {vendor: x.org, product: libxi, brew: [libxi]}                                # [cna] CVE-2026-94282 (hint 'x' != x.org)
  - {vendor: x.org, product: libxrender, brew: [libxrender]}                      # [cna] CVE-2026-88807
  - {vendor: x.org, product: libxtst, brew: [libxtst]}                            # [cna] CVE-2026-94286
  - {vendor: x.org, product: libxdmcp, brew: [libxdmcp]}                          # [nvd] CVE-2017-2625
  - {vendor: x.org, product: libxfixes, brew: [libxfixes]}                        # [nvd] CVE-2016-7944
  - {vendor: freedesktop, product: dbus, brew: [dbus]}                            # [nvd] CVE-2023-34969
  - {vendor: gnome, product: gdk-pixbuf, brew: [gdk-pixbuf]}                      # [nvd] CVE-2026-5201
  - {vendor: gnome, product: gtk, brew: [gtk+3]}                                  # [nvd] CVE-2014-1949
  - {vendor: hashicorp, product: nomad, brew: [nomad]}                            # [cna] CVE-2026-7474 (hint nomadproject)
  - {vendor: oracle, product: openjdk, brew: [openjdk]}                           # [cna] CVE-2024-20952
  - {vendor: jasper project, product: jasper, brew: [jasper]}                     # [cna] CVE-2025-8837
  - {vendor: graphviz, product: graphviz, brew: [graphviz]}                       # [nvd] CVE-2023-46045
  - {vendor: microsoft, product: odbc driver for sql server, cpe_product: odbc_driver_for_sql_server,
     brew: [msodbcsql17, msodbcsql18]}                                            # [cna] CVE-2024-29043
  - {vendor: microsoft, product: azure cli, cpe_product: azure_cli, brew: [azure-cli]}  # [cna] CVE-2026-83948, CVE-2024-43591
  - {vendor: libsdl, product: simple directmedia layer, cpe_product: simple_directmedia_layer,
     brew: [sdl2, sdl3]}                                                          # [nvd] CVE-2022-4743 (not sdl2-compat: own versions)
  - {vendor: mozilla, product: netscape portable runtime, cpe_product: netscape_portable_runtime,
     brew: [nspr]}                                                                # [nvd] CVE-2016-1951
  - {vendor: pyyaml, product: libyaml, brew: [libyaml]}                           # [nvd] CVE-2014-9130
  - {vendor: bdwgc project, product: bdwgc, brew: [bdw-gc]}                       # [nvd] CVE-2016-9427
  - {vendor: oberhumer, product: lzo2, brew: [lzo]}                               # [nvd] CVE-2014-4607
  - {vendor: srtalliance, product: secure reliable transport, cpe_product: secure_reliable_transport,
     brew: [srt]}                                                                 # [nvd] CVE-2019-15784
  - {vendor: oniguruma project, product: oniguruma, brew: [oniguruma]}            # [nvd] CVE-2019-19246
  - {vendor: libsamplerate project, product: libsamplerate, brew: [libsamplerate]}  # [nvd] CVE-2017-7697
  - {vendor: leptonica, product: leptonica, brew: [leptonica]}                    # [nvd] CVE-2022-38266
  - {vendor: md4c project, product: md4c, brew: [md4c]}                           # [nvd] CVE-2021-30027
  - {vendor: llhttp, product: llhttp, brew: [llhttp]}                             # [nvd] CVE-2022-35256
  - {vendor: gnu, product: fribidi, brew: [fribidi]}                              # [nvd] CVE-2022-25310
  - {vendor: openblas project, product: openblas, brew: [openblas]}               # [nvd] CVE-2021-4048
  - {vendor: pixman, product: pixman, brew: [pixman]}                             # [nvd] CVE-2022-44638
  - {vendor: sil, product: graphite2, brew: [graphite2]}                          # [nvd] CVE-2018-7999 (not ashlar 'graphite')
  - {vendor: openfortivpn project, product: openfortivpn, brew: [openfortivpn]}   # [nvd] CVE-2020-7043
  - {vendor: intel, product: openvino, brew: [openvino]}                          # [nvd] CVE-2023-28405
  - {vendor: intel, product: oneapi threading building blocks, cpe_product: oneapi_threading_building_blocks,
     brew: [tbb]}                                                                 # [nvd] CVE-2023-28823
  - {vendor: xiph, product: theora, brew: [theora]}                               # [nvd] CVE-2024-56431
  - {vendor: microsoft, product: z3, brew: [z3]}                                  # [nvd] CVE-2020-19725
  - {vendor: fmt, product: fmt, brew: [fmt]}                                      # [nvd] CVE-2018-1000052
  - {vendor: ripgrep project, product: ripgrep, names: [ripgrep], brew: [ripgrep]}  # [nvd] CVE-2021-3013
  - {vendor: libgd, product: libgd, brew: [gd]}                                   # [nvd] CVE-2021-40812
  - {vendor: github, product: copilot-cli, brew: [copilot-cli]}                   # [cna] CVE-2026-29783 (cask, GitHub Copilot CLI)
  - {vendor: kopia, product: kopia, names: [kopiaui], brew: [kopiaui]}                            # [cna] CVE-2026-124029 (cask: KopiaUI bundles kopia, same version)
  # ---- operating systems
  - vendor: apple
    product: macos
    names: [macos, mac os x, os x]

  # ---- windows (DisplayName after collectors/windows.py normalization, Chocolatey/Scoop ids)
  # Vendor/product spelling checked against real CVE List records where marked [cna]; [nvd] = from
  # NVD CPE knowledge only (unverified from the sandbox). CNA and NVD sometimes disagree on the vendor
  # ("win.rar GmbH" vs rarlab) -- the matcher drops candidates with a different vendor.
  - vendor: 7-zip                       # [cna] CVE-2024-11477 / CVE-2025-0411 (zdi)
    product: 7-zip
    names: [7-zip, 7zip]
  - vendor: notepad-plus-plus           # [cna] CVE-2025-49144 (GitHub_M)
    product: notepad-plus-plus
    names: [notepad++, notepadplusplus, notepad-plus-plus]
  - vendor: win.rar gmbh                # [cna] CVE-2025-8088 (ESET); NVD uses rarlab:winrar
    product: winrar
    names: [winrar, win.rar]
  - vendor: putty                       # [nvd] putty:putty (older CVEs: simon_tatham:putty)
    product: putty
    names: [putty]
  - vendor: wireshark                   # [nvd] wireshark:wireshark; CNA (GitLab) lists wireshark foundation + per-tool products
    product: wireshark
    names: [wireshark]
  - vendor: adobe                       # [cna] Adobe CNA uses "Acrobat Reader"; plain "Acrobat" is [unverified]
    product: acrobat
    names: [adobe acrobat, adobe acrobat dc, acrobat dc]
  - vendor: microsoft                   # [cna] CVE-2024-38021, CVE-2025-24057: "Microsoft 365 Apps for Enterprise" (version bound is a URL, see windows.md)
    product: microsoft 365 apps for enterprise
    names: [microsoft 365 apps for enterprise, microsoft 365 apps for business, microsoft 365 apps, microsoft office 365 proplus]
  - vendor: microsoft                   # [cna] CVE-2025-26682 cpeApplicability: microsoft:visual_studio_2022
    product: visual studio 2022
    cpe_product: visual_studio_2022
    names: [visual studio community 2022, visual studio professional 2022, visual studio enterprise 2022, visual studio buildtools 2022, visual studio build tools 2022]
  - vendor: microsoft                   # [cna] CVE-2025-21172 cpeApplicability: microsoft:visual_studio_2019
    product: visual studio 2019
    cpe_product: visual_studio_2019
    names: [visual studio community 2019, visual studio professional 2019, visual studio enterprise 2019, visual studio build tools 2019]
  - vendor: microsoft                   # [cna] "Visual Studio Code" (CVE-2024-43601); DisplayName has a "(User)" suffix for per-user installs
    product: visual studio code
    names: [microsoft visual studio code, microsoft visual studio code (user)]
  - vendor: videolan
    product: vlc media player
    cpe_product: vlc_media_player
    names: [vlc media player]
  - vendor: mozilla
    product: thunderbird
    names: [mozilla thunderbird]
  - vendor: the document foundation     # [cna] CVE-2024-3044
    product: libreoffice
    names: [libreoffice]
  - vendor: oracle corporation          # [cna] CVE-2024-21111: "VM VirtualBox"
    product: vm virtualbox
    names: [oracle vm virtualbox, virtualbox, oracle virtualbox]
  - vendor: gimp                        # [cna] CVE-2023-44444
    product: gimp
    names: [gimp]
  - vendor: google                      # Chocolatey ids
    product: chrome
    names: [googlechrome]
  - vendor: python                      # Chocolatey ids; DisplayName "Python 3.12.4 (64-bit)" -> "Python"
    product: python
    names: [python3, python launcher]
