# sec-monk Rust prototype: Cargo workspace.
# Crates, dependency rules and the reasons behind them: _docs/tech/architecture.md §2.
# The desktop crate is listed by path (cargo treats a member glob with no match as a literal path and fails).
# default-members = the core crates only: `cargo build` / `cargo test` at the root never compile Tauri, so a
# headless Linux machine without WebKitGTK builds and tests everything but the app (architecture.md §2,
# "Build features per platform"). Build the app with `cargo build -p secmonk-desktop`.

[workspace]
resolver = "3"
members = ["crates/*", "apps/desktop/src-tauri"]
default-members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94"            # sqlx 0.9 needs 1.94
publish = false
license = "UNLICENSED"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unreachable_pub = "allow"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
print_stdout = "warn"            # stdout belongs to frames in module processes; use tracing
todo = "warn"
unwrap_used = "allow"

[workspace.dependencies]
# internal crates
secmonk-model = { path = "crates/secmonk-model" }
secmonk-proto = { path = "crates/secmonk-proto" }
secmonk-safeio = { path = "crates/secmonk-safeio" }
secmonk-config = { path = "crates/secmonk-config" }
secmonk-traits = { path = "crates/secmonk-traits" }
secmonk-store = { path = "crates/secmonk-store" }
secmonk-runtime = { path = "crates/secmonk-runtime" }
secmonk-modhost = { path = "crates/secmonk-modhost" }
secmonk-host = { path = "crates/secmonk-host", default-features = false }   # features are chosen by the app: engine, probe
secmonk-probe = { path = "crates/secmonk-probe" }
secmonk-engine = { path = "crates/secmonk-engine" }
secmonk-api = { path = "crates/secmonk-api" }
secmonk-sources = { path = "crates/secmonk-sources" }

# serialization; preserve_order keeps JSON key order identical to Python's json.dumps of a dict
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.145", features = ["preserve_order"] }
toml = "1.2.1"

# async
tokio = { version = "1.52.3", default-features = false }
tokio-util = { version = "0.7.20", features = ["codec"] }
futures-core = "0.3.31"
futures-util = { version = "0.3.31", default-features = false, features = ["sink", "std"] }
bytes = "1.10"
async-trait = "0.1.89"

# errors and logging
thiserror = "2.0.18"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "env-filter"] }

# store (only secmonk-store may use these: deny.toml)
# no "macros": runtime queries only; migrations are embedded with include_str! (secmonk-store/src/migrations.rs)
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite-bundled", "migrate"] }
sea-query = { version = "1.0.2", default-features = false, features = ["backend-sqlite", "backend-postgres", "backend-mysql"] }

# runtime: uv download and extraction
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "stream"] }
sha2 = "0.11.1"
hex = "0.4.3"
tar = "0.4.46"
flate2 = "1.1.11"
zip = { version = "9.5.1", default-features = false, features = ["deflate"] }

# ui (secmonk-api, secmonk-desktop)
http = "1.3"
percent-encoding = "2.3"
opener = "0.8"
tauri = "2"
tauri-build = "2"

# misc
regex = "1.13.1"
dirs = "6.0.0"
rustix = { version = "1.1", features = ["fs", "process", "system"] }
tempfile = "3.27.0"
dunce = "1.0.5"

# Profiles live here: cargo ignores [profile] in member crates. Values from the W1.2 spike's Tauri build.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
