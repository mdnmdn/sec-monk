[package]
name = "secmonk-api"
description = "Engine to UI API of the sec-monk desktop app: route table, validation, ApiError, static files, security headers"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
http = "1.3"
percent-encoding = "2.3"
secmonk-engine = { path = "../secmonk-engine" }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt", "net", "io-util", "time", "sync"] }
tracing.workspace = true

[dev-dependencies]
async-trait.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread"] }

[lints]
workspace = true
