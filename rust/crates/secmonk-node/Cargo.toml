[package]
name = "secmonk-node"
description = "Mirror-node services over HTTP: the /node/v1 binding (match, vulninfo, feed) and the remote clients (rust ADR-0013)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[features]
default = ["server"]
# The `/node/v1` binding (`NodeApi`): pulls `secmonk-api` (and through it the API router and the engine). A client
# only (`RemoteNode`, `FeedSource`, the wire error mapping) builds with `default-features = false`.
server = ["dep:secmonk-api", "dep:secmonk-auth"]

[dependencies]
async-trait.workspace = true
base64.workspace = true                 # decoding the JWT payload for its timing claims (never verified client side)
futures-util.workspace = true
http.workspace = true
percent-encoding.workspace = true
reqwest.workspace = true                # the workspace's rustls client (as secmonk-sources and secmonk-runtime)
secmonk-api = { workspace = true, optional = true }    # Mount, json_response, error_response, ApiError (server)
secmonk-auth = { workspace = true, optional = true }   # Principal, Scope (server)
secmonk-model.workspace = true
secmonk-traits.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt", "sync", "time"] }
tracing.workspace = true

[dev-dependencies]
secmonk-engine = { path = "../secmonk-engine" }   # SkeletonEngine: the router behind the test server
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "net", "time"] }

[lints]
workspace = true

[[test]]
name = "e2e"
required-features = ["server"]
