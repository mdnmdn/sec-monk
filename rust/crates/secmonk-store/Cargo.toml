[package]
name = "secmonk-store"
description = "StateStore and MirrorStore traits, the SQLite backend (sqlx), schema v3 migrations. The only crate that speaks SQL."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
secmonk-model.workspace = true
serde.workspace = true
serde_json.workspace = true
async-trait.workspace = true
thiserror.workspace = true
tracing.workspace = true
sqlx.workspace = true
sea-query.workspace = true
tokio = { workspace = true, features = ["sync"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tempfile.workspace = true

[lints]
workspace = true

[target.'cfg(unix)'.dependencies]
# safe host name (job owner) and pid probe (stale 'running' jobs) without unsafe libc calls
rustix.workspace = true
