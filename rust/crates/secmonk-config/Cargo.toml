[package]
name = "secmonk-config"
description = "sec-monk.toml: lookup order, ownership check, data_dir resolution and layout."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
serde.workspace = true
toml.workspace = true
thiserror.workspace = true
dirs.workspace = true
tracing.workspace = true
# canonicalize without the Windows \\?\ prefix (W3.4; to be centralized in [workspace.dependencies])
dunce.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true

[target.'cfg(unix)'.dependencies]
# safe getuid (ownership check of the config file and of data_dir) without unsafe libc calls
rustix.workspace = true
