[package]
name = "secmonk-runtime"
description = "PythonRuntime trait and UvRuntime: pinned uv download, sha256 check, safe extract, uv python install, uv sync, contained environment, launch command."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
secmonk-config.workspace = true
serde.workspace = true
serde_json.workspace = true
async-trait.workspace = true
thiserror.workspace = true
tracing.workspace = true
tokio = { workspace = true, features = ["fs", "process", "io-util", "time", "rt"] }
reqwest.workspace = true
futures-util.workspace = true
sha2.workspace = true
hex.workspace = true
tar.workspace = true
flate2.workspace = true
zip.workspace = true
secmonk-model.workspace = true
secmonk-safeio.workspace = true
# canonicalize without the Windows \\?\ prefix (W3.4; to be centralized in [workspace.dependencies])
dunce.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tempfile.workspace = true
dirs.workspace = true

[lints]
workspace = true
