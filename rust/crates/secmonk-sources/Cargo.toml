[package]
name = "secmonk-sources"
description = "Native (Rust) vulnerability sources: feeds -> secmonk-mirror-rows/1 batches computed against a read-only mirror view (rust ADR-0011)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
async-trait.workspace = true
futures-util.workspace = true
reqwest.workspace = true            # the workspace's rustls client (as secmonk-runtime); no second HTTP stack
secmonk-model.workspace = true
secmonk-safeio.workspace = true
secmonk-traits.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "time"] }
tracing.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "net", "io-util"] }
tempfile.workspace = true

[lints]
workspace = true
