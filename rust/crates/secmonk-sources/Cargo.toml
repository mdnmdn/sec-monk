[package]
name = "secmonk-sources"
description = "Native (Rust) vulnerability sources: feeds -> secmonk-mirror-rows/1 batches computed against a read-only mirror view (rust ADR-0011)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
async-trait.workspace = true
flate2.workspace = true             # epss: the gzip feed (already in the lock for the uv archive); single member, capped output
futures-util.workspace = true
regex.workspace = true              # debian-tracker: the line patterns of the tracker's text lists (as secmonk-safeio)
reqwest.workspace = true            # the workspace's rustls client (as secmonk-runtime); no second HTTP stack
secmonk-model.workspace = true
secmonk-safeio.workspace = true
secmonk-traits.workspace = true
serde.workspace = true              # euvd: a bounded visitor over the records of a feed document (no derive needed)
serde_json.workspace = true
sha2.workspace = true               # debian-tracker: the cursor (SHA-256 of the content, as the Python source; as secmonk-runtime)
tokio = { workspace = true, features = ["fs", "io-util", "rt", "sync", "time"] }  # sync: debian-tracker download -> parser channel
tracing.workspace = true

[dev-dependencies]
flate2.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "net", "io-util"] }
tempfile.workspace = true

[lints]
workspace = true
