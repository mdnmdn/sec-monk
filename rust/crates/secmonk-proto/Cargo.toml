[package]
name = "secmonk-proto"
description = "secmonk-wire/1: envelope, hello, error codes, method names, module manifest, frame codec."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
bytes = { workspace = true, optional = true }
tokio-util = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["io-util", "macros", "rt"] }
tokio-util.workspace = true
futures-util.workspace = true
toml.workspace = true

[lints]
workspace = true

[features]
default = ["codec"]
# The async frame codec (tokio-util Decoder/Encoder over bytes; no runtime, no I/O of its own).
codec = ["dep:bytes", "dep:tokio-util"]
