[package]
name = "secmonk-desktop"
description = "sec-monk desktop app: Tauri shell over the composed host, custom scheme serving the current UI; headless without the ui feature"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

# Platform builds (architecture.md "Build features per platform"):
#   macOS, Windows, Linux with WebKitGTK   cargo build -p secmonk-desktop                   (ui + engine + probe)
#   Linux headless                         cargo build -p secmonk-desktop --no-default-features --features engine,probe
# `ui` needs the engine (the window shows its API), so it implies it.
[features]
default = ["ui", "engine", "probe"]
ui = ["engine", "dep:tauri", "dep:tauri-build", "dep:opener"]
engine = ["secmonk-host/engine", "dep:secmonk-api"]
probe = ["secmonk-host/probe"]

[lib]
name = "secmonk_desktop_lib"
path = "src/lib.rs"

[[bin]]
name = "secmonk-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { workspace = true, optional = true }

[dependencies]
secmonk-config.workspace = true
secmonk-host.workspace = true
# opener: http(s) links leave the window through the OS (Rust side, no Tauri IPC / plugin permission)
opener = { workspace = true, optional = true }
secmonk-api = { workspace = true, optional = true }
tauri = { workspace = true, optional = true }
tracing.workspace = true

[lints]
workspace = true
