[project]
name = "secmonk-modules"
version = "0.1.0"
description = "sec-monk protocol modules (secmonk-wire/1): py-probe, py-sources, py-engine, py-procmon"
requires-python = ">=3.12,<3.14"
dependencies = ["secmonk"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "jsonschema>=4.21"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/secmonk_modules"]

[tool.uv]
# the existing `secmonk` package is used in place (never copied, never edited)
[tool.uv.sources]
secmonk = { path = "../..", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: slow test"]

[tool.ruff]
line-length = 110
target-version = "py312"
